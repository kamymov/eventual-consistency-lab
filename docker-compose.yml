services:

  # =========================
  # Oracle DB 1
  # =========================
  oracle-db1:
    image: container-registry.oracle.com/database/free:23.26.3.0-lite
    container_name: oracle-db1

    environment:
      ORACLE_PWD: Oracle123

    ports:
      - "1521:1521"

    volumes:
      - oracle-db1-data:/opt/oracle/oradata
      - ./oracle/db1/init:/opt/oracle/scripts/startup

    networks:
      - cdc-network


  # =========================
  # Oracle DB 2
  # =========================
  oracle-db2:
    image: container-registry.oracle.com/database/free:23.26.3.0-lite
    container_name: oracle-db2

    environment:
      ORACLE_PWD: Oracle123

    ports:
      - "1522:1521"

    volumes:
      - oracle-db2-data:/opt/oracle/oradata
      - ./oracle/db2/init:/opt/oracle/scripts/startup

    networks:
      - cdc-network


  # =========================
  # Kafka
  # =========================
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka

    ports:
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - cdc-network

  # =========================
  # Debezium / Kafka Connect
  # =========================
  debezium:
    image: quay.io/debezium/connect:3.4
    container_name: debezium

    depends_on:
      kafka:
        condition: service_healthy
      oracle-db1:
        condition: service_started
      oracle-db2:
        condition: service_started

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:9092

      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

    networks:
      - cdc-network


# =========================
# Volumes
# =========================
volumes:
  oracle-db1-data:
  oracle-db2-data:


# =========================
# Network
# =========================
networks:
  cdc-network:
    driver: bridge
